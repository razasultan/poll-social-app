name: CI

# Runs on every push and pull request.
#
# - analyze / unit-tests / build-web / build-android: run for every push and
#   PR (fast feedback on feature branches and PRs targeting main).
# - e2e-web / integration-test: only run on pushes to main (extended
#   validation against the real DEV Supabase backend, with Playwright
#   artifacts uploaded on every run).
#
# See README.md "CI/CD" section for how to run these checks locally and how
# to debug a failed run.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.41.6'
  # Publishable DEV Supabase config (poll-social-app-dev). These are public
  # anon keys, safe to expose — see README "Environments (DEV / PROD)".
  # Configured as repo variables so there's one place to update them.
  SUPABASE_URL_DEV: ${{ vars.SUPABASE_URL_DEV }}
  SUPABASE_ANON_KEY_DEV: ${{ vars.SUPABASE_ANON_KEY_DEV }}

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze

  unit-tests:
    name: Unit & widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build web \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL_DEV }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY_DEV }}

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL_DEV }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY_DEV }}

  e2e-web:
    name: Playwright E2E (web)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [analyze, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Flutter web for E2E
        run: |
          flutter build web \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL_DEV }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY_DEV }}
      - run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Playwright test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  # NOTE: integration_test/app_test.dart is not currently runnable in CI.
  # `flutter test integration_test/app_test.dart -d chrome` is unsupported by
  # the Flutter web target ("Web devices are not supported for integration
  # tests yet"). Running it would require either `flutter drive` with a
  # test_driver harness (web) or a Linux-desktop runner with GTK deps for
  # `-d linux`. Tracked as future work — see README "CI/CD" section.
