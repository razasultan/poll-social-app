<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ask questions. Start conversations. See what the world really thinks. Poll Social is the social network built around polls.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Poll Social">
  <meta property="og:title"       content="Poll Social — The social network built around polls">
  <meta property="og:description" content="Ask questions. Start conversations. See what the world really thinks.">
  <meta property="og:image"       content="https://uwomsxkvjqrvhdpnbkit.supabase.co/storage/v1/object/public/poll-media/2ab016e9-0adb-4e7f-8f56-cc89950f0bea/app-default-share-image-v2.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Poll Social — The social network built around polls">
  <meta name="twitter:description" content="Ask questions. Start conversations. See what the world really thinks.">
  <meta name="twitter:image"       content="https://uwomsxkvjqrvhdpnbkit.supabase.co/storage/v1/object/public/poll-media/2ab016e9-0adb-4e7f-8f56-cc89950f0bea/app-default-share-image-v2.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Poll Social">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Poll Social — The social network built around polls</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Required by the `passkeys` plugin (pulled in transitively by
    supabase_flutter's gotrue for optional WebAuthn support — this app
    doesn't call any passkey APIs itself). Without this, the plugin's web
    implementation throws on startup and crashes the app. Version must match
    the passkeys_web version in pubspec.lock; see its CHANGELOG for the
    matching bundle.js release if upgrading.
  -->
  <script src="passkeys-bundle.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
